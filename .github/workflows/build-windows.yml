
name: Build Rocky RAW Studio Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip install pyinstaller

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --onefile --noconsole --name Rocky_RAW_Studio --add-data "index.html;." --add-data "assets;assets" app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Rocky-RAW-Studio-Windows
          path: dist/Rocky_RAW_Studio.exe
